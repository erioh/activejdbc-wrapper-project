name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sources target Java 8, so 8 must keep working; the rest are LTS releases plus the latest JDK
        java: ['8', '11', '17', '21', '25', '27']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # no signing key in CI
      - run: mvn -B verify -Dgpg.skip
