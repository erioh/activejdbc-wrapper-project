name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sources target Java 8, so 8 must keep working; the rest are LTS releases plus the latest JDK
        java: ['8', '11', '17', '21', '25', '27']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # no signing key in CI
      - run: mvn -B verify -Dgpg.skip

  gradle:
    # the processor in a Gradle build, set up as the README tells users to
    runs-on: ubuntu-latest
    name: Gradle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # the repository allows only GitHub's own actions, so Gradle is installed by hand
      - name: Install Gradle
        env:
          GRADLE_VERSION: '9.8.0'
          GRADLE_SHA256: bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
        run: |
          curl -sSfLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      - name: Install the library into the local Maven repository
        run: mvn -B install -Dgpg.skip -DskipTests
      - name: Build and test gradle-it
        working-directory: gradle-it
        run: |
          version=$(mvn -q -f ../pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          gradle test -PactivejdbcWrapperVersion="$version"
          # the processor is declared isolating: a change in one class must not recompile the whole project,
          # and the wrapper of a model whose annotation references the changed class must be regenerated
          echo "// changed" >> src/main/java/gradleit/Status.java
          gradle test -PactivejdbcWrapperVersion="$version" --info > compile.log
          if grep "Full recompilation is required" compile.log; then exit 1; fi
          grep "Incremental compilation of" compile.log
