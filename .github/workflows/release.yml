name: Release

# Run by hand from the Actions tab on dev: master only ever gets released code, moved forward to the release tag.
# Publishing to Maven Central can't be undone; the release job waits for approval in the "release" environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.0
        required: true
      dry-run:
        description: Build and sign everything, but don't upload, tag or push
        type: boolean
        default: false

concurrency: release

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry-run }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the input
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::version must look like 1.2.0"; exit 1; fi
          if [[ "$BRANCH" != dev ]]; then echo "::error::run it on dev"; exit 1; fi
          # checked before publishing: master must move forward to the release without a merge
          if ! git merge-base --is-ancestor origin/master HEAD; then echo "::error::master has commits that dev doesn't, merge master into dev first"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then echo "::error::tag v$VERSION already exists"; exit 1; fi
      # sources target Java 8, so the release is built on 8 like the code users compile against
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Set the version
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          # the dependency examples in the README name the released version
          sed -i "s|<version>$previous</version>|<version>$VERSION</version>|" README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "Release $VERSION"
      - name: Build, sign and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -DskipPublishing="$DRY_RUN"
      - name: Tag, move master to the release, start the next version on dev
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "v$VERSION" -m "Release $VERSION"
          IFS=. read -r major minor patch <<< "$VERSION"
          next="$major.$minor.$((patch + 1))-SNAPSHOT"
          release=$(git rev-parse HEAD)
          mvn -B -q versions:set -DnewVersion="$next" -DgenerateBackupPoms=false
          git commit -qam "Prepare $next"
          # one push: the tag, master at the release commit (fast-forward) and dev with the next version
          git push --atomic origin "v$VERSION" "$release:refs/heads/master" HEAD:dev
          gh release create "v$VERSION" --verify-tag --generate-notes --title "$VERSION" target/activejdbc-wrapper-"$VERSION"*.jar
